name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows too: liveness, paths and hook shims behave differently there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run theme:check
      - run: npm test
      - run: npm run build

      # The release package (what the `release` branch pipeline publishes): built, unpacked and run for real, with
      # its installer, so a packaging problem shows up here and not on release day.
      - name: Package and smoke-test
        shell: bash
        run: |
          npm run package
          node scripts/package-smoke.mjs "release/agent-office-$(node -p "require('./package.json').version")" --installer

      # The desktop app's logic is type-checked against Electron's types (the binary isn't needed for that).
      - name: Desktop app typecheck
        if: matrix.os == 'ubuntu-latest'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix desktop
          npm run desktop:typecheck

      # P2-11: render the demo office in Chrome (software WebGL) and keep the screenshots.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run shot -- --out artifacts --themes
      - if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: office-screenshots
          path: artifacts/
          if-no-files-found: ignore

  # The real desktop app (P9-09): build the unpacked Windows app and drive it. Windows only: that is what ships first.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci
      - run: npm run desktop:install
      - name: Build the unpacked app
        run: node desktop/tools/pack.mjs --dir
      - name: Smoke test the app
        shell: bash
        run: node desktop/tools/smoke.mjs "desktop/out/win-unpacked/Agent Office.exe" --out artifacts-desktop
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-screenshots
          path: artifacts-desktop/
          if-no-files-found: ignore
